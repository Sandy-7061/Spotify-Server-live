services:
  - type: web
    name: spotify-server
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host=0.0.0.0 --port=$PORT
    envVars:
      - key: DATABASE_URL
        sync: false  # This will prompt for the value during deployment
      - key: PYTHON_VERSION
        value: 3.11 